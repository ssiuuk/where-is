name: Build Android App

# Two jobs, so code from a pull request never runs with write access or secrets:
# - check: pull requests. Read-only token, no secrets, a build signed with a
#   temporary key, uploaded as a workflow artifact. android-preview.yml (which
#   always runs the main branch's copy) publishes it as a per-PR preview.
# - release: main, published releases and manual runs, i.e. reviewed code only.
#   Uses the "release" environment, which holds the signing and Firebase secrets.

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
      - '.github/actions/build-android/**'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
      - '.github/actions/build-android/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the built app to this existing release'
        required: false
  # publishing a release builds the app and attaches it to the release
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/build-android
        with:
          version-code: ${{ github.run_number }}
          version-name: 0.1.${{ github.run_number }}-pr${{ github.event.pull_request.number }}
          whereis-host: ${{ vars.WHEREIS_HOST }}

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: where-is-android
          path: ${{ runner.temp }}/where-is-android.apk

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # protect this environment (Settings > Environments) so only main and release tags can use its secrets
    environment: release
    permissions:
      contents: write
    steps:
      - name: Choose the release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ]; then
            # a tag such as v1.2.0 becomes the version name 1.2.0
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag || github.ref }}
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/build-android
        with:
          version-code: ${{ github.run_number }}
          version-name: ${{ steps.release.outputs.version }}
          whereis-host: ${{ vars.WHEREIS_HOST }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: where-is-android
          path: ${{ runner.temp }}/where-is-android.apk

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main' && steps.release.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view android-latest > /dev/null 2>&1; then
            gh release create android-latest --prerelease --target "$GITHUB_SHA" \
              --title "Android app (latest build)" \
              --notes "Open this page on your Android phone and download where-is-android.apk to install or update the app."
          fi
          gh release upload android-latest "$RUNNER_TEMP/where-is-android.apk" --clobber

      - name: Attach to the release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/where-is-android.apk" --clobber

      # testers get each release through Firebase App Distribution once FIREBASE_APP_ID and FIREBASE_SERVICE_ACCOUNT are set
      - name: Send to Firebase App Distribution
        if: steps.release.outputs.tag != ''
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::FIREBASE_APP_ID or FIREBASE_SERVICE_ACCOUNT is not set, so the release is not sent to Firebase App Distribution"
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          printf '%s\n' "${RELEASE_NOTES:-Where Is $RELEASE_TAG}" > "$RUNNER_TEMP/release-notes.txt"
          npx --yes firebase-tools@13.29.1 appdistribution:distribute "$RUNNER_TEMP/where-is-android.apk" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"
          rm -f "$RUNNER_TEMP/firebase.json"
